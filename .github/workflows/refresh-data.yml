name: Actualisation des données (Python Collector)

on:
  schedule:
    # Exécution automatique toutes les 6 heures
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Exécuter le collecteur Python
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
        run: python3 scripts/collect.py

      - name: Publier les données mises à jour
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data.json
          git diff --staged --quiet || (git commit -m "chore(data): actualisation automatique des données Amazon" && git push)
